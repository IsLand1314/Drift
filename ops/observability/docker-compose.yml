services:
  pushgateway:
    image: ${DRIFT_PUSHGATEWAY_IMAGE:-m.daocloud.io/docker.io/prom/pushgateway:v1.11.3}
    command:
      - --persistence.file=/data/pushgateway.data
      - --persistence.interval=5m
    ports:
      - "127.0.0.1:9091:9091"
    volumes:
      - pushgateway-data:/data

  prometheus:
    image: ${DRIFT_PROMETHEUS_IMAGE:-m.daocloud.io/docker.io/prom/prometheus:v3.14.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - pushgateway

  grafana:
    image: ${DRIFT_GRAFANA_IMAGE:-m.daocloud.io/docker.io/grafana/grafana:13.2.2}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pushgateway-data:
  prometheus-data:
  grafana-data:
